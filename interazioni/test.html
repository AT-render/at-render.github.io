<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzazione modello 3D | AT‑render</title>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    #menu {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 8px;
    }
    button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div id="menu">
    <button id="btn-marmo">Top Marmo Marquinia</button>
    <button id="btn-noce">Top Noce Canaletto</button>
    <button id="btn-vetro">Top Vetro Fumé</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Configurazione Scena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    // 2. Configurazione Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2, 2, 3); 

    // 3. Configurazione Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // 4. Illuminazione da Studio
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(hemiLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight1.position.set(5, 10, 7.5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight2.position.set(-5, 5, -5);
    scene.add(dirLight2);

    // 5. Controlli OrbitControls (Rotazione e Zoom)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.5, 0); 

    let tavoloModello = null;
    let materialeTop = null;  // Conterrà il riferimento a top_MAT
    let materialeGamba = null; // Conterrà il riferimento a Leg_MAT (se ti servirà in futuro)

    // 6. Caricamento Modello .glb con Ispezione Diagnostica dei Materiali
    const loader = new GLTFLoader();
    loader.load('./Lemans.tavolo.glb', (gltf) => {
      tavoloModello = gltf.scene;
      
      // Correzione scala radice di Blender (da 0.01 a 1 metro reale)
      tavoloModello.scale.set(1, 1, 1); 
      scene.add(tavoloModello);
      
      console.log('--- ISPEZIONE STRUTTURA MATERIALI ---');

      tavoloModello.traverse((child) => {
        if (child.isMesh) {
          console.log(`Mesh rilevata: "${child.name}"`);
          
          // Caso A: La mesh ha un array di materiali (Multi-Material)
          if (Array.isArray(child.material)) {
            child.material.forEach((mat, index) => {
              console.log(`  -> Slot [${index}]: "${mat.name}"`);
              if (mat.name.toLowerCase().includes('top')) materialeTop = mat;
              if (mat.name.toLowerCase().includes('leg')) materialeGamba = mat;
            });
          } 
          // Caso B: La mesh ha un singolo materiale associato
          else if (child.material) {
            console.log(`  -> Materiale singolo: "${child.material.name}"`);
            if (child.material.name.toLowerCase().includes('top')) materialeTop = child.material;
            if (child.material.name.toLowerCase().includes('leg')) materialeGamba = child.material;
          }
        }
      });

      console.log('--------------------------------------');

      // Se abbiamo intercettato il materiale del top, applichiamo il marmo come default iniziale
      if (materialeTop) {
        console.log(`✅ Successo: Agganciato materiale del top ("${materialeTop.name}")`);
        impostaMarmo(materialeTop);
      } else {
        console.warn("❌ Errore: Nessun materiale nel file GLB contiene la parola 'top' nel nome.");
      }

    }, undefined, (error) => {
      console.error('Errore nel caricamento del file .glb:', error);
    });

    // 7. Funzioni di Modifica Proprietà (Agiscono sui parametri nativi senza sovrapposizioni)
    function impostaMarmo(mat) {
      mat.color = new THREE.Color(0x141414); // Nero Marquinia
      mat.roughness = 0.05;                  // Molto lucido / riflettente
      mat.metalness = 0.1;
      mat.transparent = false;
      mat.opacity = 1.0;
      if (mat.transmission !== undefined) mat.transmission = 0.0;
      mat.needsUpdate = true;
    }

    function impostaNoce(mat) {
      mat.color = new THREE.Color(0x4a3319); // Marrone noce canaletto
      mat.roughness = 0.6;                  // Opaco, tipico del legno trattato
      mat.metalness = 0.0;
      mat.transparent = false;
      mat.opacity = 1.0;
      if (mat.transmission !== undefined) mat.transmission = 0.0;
      mat.needsUpdate = true;
    }

    function impostaVetro(mat) {
      mat.color = new THREE.Color(0x2c3539); // Grigio scuro fumé
      mat.roughness = 0.1;                  // Superficie vitrea liscia
      mat.metalness = 0.1;
      mat.transparent = true;
      mat.opacity = 0.4;                    // Trasparenza al 40%
      if (mat.transmission !== undefined) {
        mat.transmission = 0.9;             // Sfrutta il canale di trasmissione fisica di Three.js se disponibile
      }
      mat.needsUpdate = true;
    }

    // 8. Assegnazione Eventi ai Pulsanti del Menu
    document.getElementById('btn-marmo').addEventListener('click', () => {
      if (materialeTop) {
        impostaMarmo(materialeTop);
        console.log('Cambio finitura: Marmo Marquinia');
      }
    });

    document.getElementById('btn-noce').addEventListener('click', () => {
      if (materialeTop) {
        impostaNoce(materialeTop);
        console.log('Cambio finitura: Noce Canaletto');
      }
    });

    document.getElementById('btn-vetro').addEventListener('click', () => {
      if (materialeTop) {
        impostaVetro(materialeTop);
        console.log('Cambio finitura: Vetro Fumé');
      }
    });

    // 9. Loop di Rendering dell'Animazione
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 10. Gestione Ridimensionamento Finestra Browser
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
