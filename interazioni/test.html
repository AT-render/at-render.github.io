<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzazione modello 3D | AT‑render</title>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    #menu {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 8px;
    }
    button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div id="menu">
    <button id="btn-marmo">Top Marmo Marquinia</button>
    <button id="btn-noce">Top Noce Canaletto</button>
    <button id="btn-vetro">Top Vetro Fumé</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Configurazione Scena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9c9c9c);

    // 2. Configurazione Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2, 2, 3); 

    // 3. Configurazione Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // 4. Illuminazione da Studio
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(hemiLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight1.position.set(5, 10, 7.5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight2.position.set(-5, 5, -5);
    scene.add(dirLight2);

    // 5. Controlli OrbitControls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.5, 0); 

    let tavoloModello = null;
    let materialeTop = null; 

    // 6. Caricamento Modello .glb
    const loader = new GLTFLoader();
    loader.load('./Lemans.tavolo.glb', (gltf) => {
      tavoloModello = gltf.scene;
      tavoloModello.scale.set(1, 1, 1); 
      scene.add(tavoloModello);
      
      tavoloModello.traverse((child) => {
        if (child.isMesh) {
          if (child.material && child.material.name === 'Top_MAT') {
            materialeTop = child.material;
          }
        }
      });

      if (materialeTop) {
        console.log(`✅ Successo: Agganciato materiale del top ("Top_MAT")`);
        impostaVetro(materialeTop); // 🌟 Impostato come DEFAULT iniziale
      }

    }, undefined, (error) => {
      console.error('Errore nel caricamento del file .glb:', error);
    });

    // 🛠️ FUNZIONE DI RESET COMPLETA: Pulisce le texture prima di applicare i cambi
    function resetMateriale(mat) {
      mat.map = null;             
      mat.normalMap = null;       
      mat.roughnessMap = null;    
      mat.metalnessMap = null;    
      mat.bumpMap = null;
      mat.transparent = false;
      mat.opacity = 1.0;
      if (mat.transmission !== undefined) mat.transmission = 0.0;
    }

    // 🪵 GENERATORE PROCEDURALE DEL LEGNO AVANZATO (Fotorealistico)
    function generaTextureLegno() {
      const size = 1024; // Aumentato a 1024 per maggiore nitidezza e micro-dettagli
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 1. Colore di fondo del Noce Canaletto (morbido e caldo)
      ctx.fillStyle = '#5c4028';
      ctx.fillRect(0, 0, size, size);

      // Finto rumore di fondo (Pori del legno)
      for (let i = 0; i < 3000; i++) {
        ctx.fillStyle = `rgba(60, 38, 20, ${Math.random() * 0.15})`;
        ctx.fillRect(Math.random() * size, Math.random() * size, 1 + Math.random() * 2, 1 + Math.random() * 4);
      }

      // 2. Stratificazione delle venature principali e secondarie
      // Usiamo più passaggi con opacità diverse per creare profondità
      const passaggi = [
        { color: 'rgba(43, 26, 12, 0.25)', linee: 180, width: 3 },  // Venature larghe di fondo
        { color: 'rgba(33, 18, 6, 0.4)', linee: 220, width: 1.5 }, // Venature medie definite
        { color: 'rgba(75, 52, 34, 0.2)', linee: 100, width: 4 }   // Sfumature chiare di contrasto
      ];

      passaggi.forEach(passo => {
        ctx.lineWidth = passo.width;
        
        // Sfasamento ondulatorio matematico (Pseudo-Noise)
        const randSeed = Math.random() * 100;

        for (let i = -size; i < size * 2; i += (size / passo.linee)) {
          ctx.beginPath();
          ctx.strokeStyle = passo.color;
          
          for (let y = 0; y <= size; y += 5) {
            // Unione di onde a frequenze diverse per rompere la geometricità
            const wave1 = Math.sin(y * 0.008 + randSeed) * 25;
            const wave2 = Math.sin(y * 0.025 + randSeed * 2) * 8;
            const wave3 = Math.cos(y * 0.002) * 40; // Ondulazione macroscopica
            
            // Un piccolo disturbo randomico per simulare la fibra grezza
            const microNoise = (Math.random() - 0.5) * 0.8;

            const x = i + wave1 + wave2 + wave3 + microNoise + (y * 0.15);
            
            if (y === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
      });

      // Creiamo anche una mappa di roughness basata sullo stesso canvas ma convertito
      const canvasRough = document.createElement('canvas');
      canvasRough.width = size;
      canvasRough.height = size;
      const ctxRough = canvasRough.getContext('2d');
      // Disegna una base grigia (riflessione media) e sovrappone il canvas del legno in modalità multiply
      ctxRough.fillStyle = '#888888';
      ctxRough.fillRect(0, 0, size, size);
      ctxRough.globalAlpha = 0.5;
      ctxRough.drawImage(canvas, 0, 0);

      // Generazione delle texture di Three.js
      const textureColor = new THREE.CanvasTexture(canvas);
      textureColor.wrapS = THREE.RepeatWrapping;
      textureColor.wrapT = THREE.RepeatWrapping;
      textureColor.repeat.set(1, 1.5); // Regola la scala per stirarla elegantemente

      const textureRough = new THREE.CanvasTexture(canvasRough);
      textureRough.wrapS = THREE.RepeatWrapping;
      textureRough.wrapT = THREE.RepeatWrapping;
      textureRough.repeat.set(1, 1.5);

      return { color: textureColor, rough: textureRough };
    }


    // 7. Funzioni di Modifica Proprietà per le 3 Finiture
    function impostaMarmo(mat) {
      resetMateriale(mat);        
      mat.color = new THREE.Color(0xfcfcfc); // 
      mat.roughness = 0.05;                  // Lucido a specchio
      mat.metalness = 0.1;
      mat.needsUpdate = true;
    }

    function impostaNoce(mat) {
      resetMateriale(mat);        
      
      const textures = generaTextureLegno();
      
      mat.map = textures.color;
      mat.bumpMap = textures.color;            // Il bump basato sul colore funziona bene per scavare le vene scure
      mat.bumpScale = 0.004;                   // Ridotto: le venature reali sono micro-rilievi, non solchi profondi
      
      mat.roughnessMap = textures.rough;       // Mappa per riflessi irregolari realistici
      mat.roughness = 0.45;                    // Bilanciamento lucido/opaco di base
      mat.metalness = 0.0;
      
      mat.color = new THREE.Color(0xffffff); 
      mat.needsUpdate = true;
    }

    function impostaVetro(mat) {
      resetMateriale(mat);        
      mat.color = new THREE.Color(0x2c3539); // Grigio fumo
      mat.roughness = 0.05;                 // Perfettamente liscio
      mat.metalness = 0.1;
      mat.transparent = true;
      mat.opacity = 0.3;                    // Trasparenza visiva
      if (mat.transmission !== undefined) {
        mat.transmission = 0.95;            // Canale di rifrazione fisica del vetro reale
      }
      mat.needsUpdate = true;
    }

    // 8. Eventi Pulsanti Menu
    document.getElementById('btn-marmo').addEventListener('click', () => {
      if (materialeTop) {
        impostaMarmo(materialeTop);
        console.log('Finitura applicata: Marmo Marquinia');
      }
    });

    document.getElementById('btn-noce').addEventListener('click', () => {
      if (materialeTop) {
        impostaNoce(materialeTop);
        console.log('Finitura applicata: Noce Canaletto con Venature');
      }
    });

    document.getElementById('btn-vetro').addEventListener('click', () => {
      if (materialeTop) {
        impostaVetro(materialeTop);
        console.log('Finitura applicata: Vetro Fumé');
      }
    });

    // 9. Loop di Rendering
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 10. Gestione Finestra Browser
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
