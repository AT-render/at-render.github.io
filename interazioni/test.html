<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzazione modello 3D | AT‑render</title>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    #menu {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .picker-container {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 14px;
      border-left: 1px solid #555;
      padding-left: 15px;
    }
    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: 2px solid #fff;
      border-radius: 50%;
    }
    button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div id="menu">
    <button id="btn-marmo">Top Marmo</button>
    <button id="btn-noce">Top Legno</button>
    <button id="btn-vetro">Top Vtero Fumè</button>
    
    <div class="picker-container">
      <label for="color-gambe">Colore Gamba:</label>
      <input type="color" id="color-gambe" value="#ffffff">
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9c9c9c);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2, 2, 3); 

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(hemiLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight1.position.set(5, 10, 7.5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight2.position.set(-5, 5, -5);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.5, 0); 

    let meshTop = null;
    let materialeGambe = null; // Memorizzerà il materiale Leg_Mat
    const materialiBlender = {};

    const loader = new GLTFLoader();
    loader.load('./Lemans.tavolo.glb', (gltf) => {
      const tavoloModello = gltf.scene;
      tavoloModello.scale.set(1, 1, 1); 
      scene.add(tavoloModello);
      
      if (gltf.parser && gltf.parser.json && gltf.parser.json.materials) {
        gltf.parser.json.materials.forEach((matInfo, index) => {
          if (matInfo.name === 'Top_MAT.001' || matInfo.name === 'Top_MAT.002' || matInfo.name === 'Top_MAT.003') {
            gltf.parser.getDependency('material', index).then((materialePronto) => {
              materialiBlender[matInfo.name] = materialePronto;
            });
          }
        });
      }

      tavoloModello.traverse((child) => {
        if (child.isMesh && child.material) {
          // Rilevamento mesh del Top
          if (child.material.name === 'Top_MAT.001' || child.material.name === 'Top_MAT') {
            meshTop = child;
            materialiBlender['Top_MAT.001'] = child.material;
          }
          
          // Rilevamento materiale delle gambe (Leg_Mat)
          if (child.material.name === 'Leg_MAT') {
            materialeGambe = child.material;
            
            // Sincronizza il color picker con il colore iniziale del file di Blender
            const coloreIniziale = '#' + materialeGambe.color.getHexString();
            document.getElementById('color-gambe').value = coloreIniziale;
          }
        }
      });

    }, undefined, (error) => {
      console.error('Errore nel caricamento del file .glb:', error);
    });

    function applicaMaterialeNativo(nomeMateriale) {
      if (!meshTop) return;
      const materialeScelto = materialiBlender[nomeMateriale];
      if (materialeScelto) {
        meshTop.material = materialeScelto;
        meshTop.material.needsUpdate = true;
      }
    }

    // Listener per i pulsanti del Top
    document.getElementById('btn-marmo').addEventListener('click', () => {
      applicaMaterialeNativo('Top_MAT.001');
    });

    document.getElementById('btn-noce').addEventListener('click', () => {
      applicaMaterialeNativo('Top_MAT.002');
    });

    document.getElementById('btn-vetro').addEventListener('click', () => {
      applicaMaterialeNativo('Top_MAT.003');
    });

    // Evento per la gestione del Color Picker
    document.getElementById('color-gambe').addEventListener('input', (event) => {
      if (materialeGambe) {
        // Aggiorna il colore convertendo la stringa HEX in un colore Three.js
        materialeGambe.color.set(event.target.value);
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
