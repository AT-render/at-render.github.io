<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzazione modello 3D | AT‑render</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    #menu {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 8px;
    }
    button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div id="menu">
    <button id="btn-marmo">Top Marmo Marquinia</button>
    <button id="btn-noce">Top Noce Canaletto</button>
    <button id="btn-vetro">Top Vetro Fumé</button>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js';

    // ✅ Avvolgiamo tutto in un listener per essere sicuri che la pagina sia pronta
    window.addEventListener('DOMContentLoaded', () => {
      
      // 1. Scena
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);

      // 2. Camera (Posizionata per inquadrare correttamente un tavolo in scala metrica)
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(2, 2, 3); 

      // 3. Renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.appendChild(renderer.domElement);

      // 4. Luci da studio per valorizzare le geometrie
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
      scene.add(hemiLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight1.position.set(5, 10, 7.5);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight2.position.set(-5, 5, -5);
      scene.add(dirLight2);

      // 5. Controlli Orbitabili (Puntano a 0.5 metri di altezza)
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0.5, 0); 

      let tavoloModello = null;

      // 6. Caricamento Modello GLB
      const loader = new GLTFLoader();
      loader.load('./Lemans.tavolo.glb', (gltf) => {
        tavoloModello = gltf.scene;
        
        // Forziamo la scala a 1 se l'esportatore ha aggiunto un moltiplicatore ridotto
        tavoloModello.scale.set(1, 1, 1); 
        
        scene.add(tavoloModello);
        console.log('Modello caricato con successo!');

        tavoloModello.traverse((child) => {
          if (child.isMesh) {
            console.log("Componente rilevato:", child.name);
          }
        });

      }, undefined, (error) => {
        console.error('Errore nel caricamento del modello:', error);
      });

      // 7. Gestione Pulsanti (Ora che siamo sicuri che esistano nel DOM)
      const btnMarmo = document.getElementById('btn-marmo');
      const btnNoce = document.getElementById('btn-noce');
      const btnVetro = document.getElementById('btn-vetro');

      if (btnMarmo) {
        btnMarmo.addEventListener('click', () => {
          if (!tavoloModello) return;
          tavoloModello.traverse((child) => {
            if (child.isMesh && child.name.includes('Piano.Botte')) {
              child.material = new THREE.MeshStandardMaterial({
                color: 0x141414,
                roughness: 0.05,
                metalness: 0.1
              });
            }
          });
          console.log('Applicato: Marmo Marquinia');
        });
      }

      if (btnNoce) {
        btnNoce.addEventListener('click', () => {
          if (!tavoloModello) return;
          tavoloModello.traverse((child) => {
            if (child.isMesh && child.name.includes('Piano.Botte')) {
              child.material = new THREE.MeshStandardMaterial({
                color: 0x4a3319,
                roughness: 0.5,
                metalness: 0.0
              });
            }
          });
          console.log('Applicato: Noce Canaletto');
        });
      }

      if (btnVetro) {
        btnVetro.addEventListener('click', () => {
          if (!tavoloModello) return;
          tavoloModello.traverse((child) => {
            if (child.isMesh && child.name.includes('Piano.Botte')) {
              child.material = new THREE.MeshStandardMaterial({
                color: 0x2c3539,
                roughness: 0.1,
                transparent: true,
                opacity: 0.5
              });
            }
          });
          console.log('Applicato: Vetro Fumé');
        });
      }

      // 8. Loop di Animazione
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // 9. Ridimensionamento finestra
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

    });
  </script>

</body>
</html>
