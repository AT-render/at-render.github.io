<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzazione modello 3D | AT‑render</title>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    #menu {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 8px;
    }
    button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div id="menu">
    <button id="btn-mat1">Materiale 001</button>
    <button id="btn-mat2">Materiale 002</button>
    <button id="btn-mat3">Materiale 003</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Configurazione Scena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9c9c9c);

    // 2. Configurazione Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2, 2, 3); 

    // 3. Configurazione Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // 4. Illuminazione da Studio
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(hemiLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight1.position.set(5, 10, 7.5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight2.position.set(-5, 5, -5);
    scene.add(dirLight2);

    // 5. Controlli OrbitControls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.5, 0); 

    // Variabili per tracciare la mesh del top e archiviare i materiali di Blender
    let meshTop = null;
    const materialiBlender = {
      'Top_MAT.001': null,
      'Top_MAT.002': null,
      'Top_MAT.003': null
    };

    // 6. Caricamento Modello .glb
    const loader = new GLTFLoader();
    loader.load('./Lemans.tavolo.glb', (gltf) => {
      const tavoloModello = gltf.scene;
      tavoloModello.scale.set(1, 1, 1); 
      scene.add(tavoloModello);
      
      // Primo passaggio: cerchiamo e archiviamo tutti i materiali presenti nel file del modello
      tavoloModello.traverse((child) => {
        if (child.isMesh && child.material) {
          const nomeMat = child.material.name;
          
          // Se il nome corrisponde a uno dei tre che stiamo cercando, lo salviamo nel nostro archivio
          if (nomeMat === 'Top_MAT.001' || nomeMat === 'Top_MAT.002' || nomeMat === 'Top_MAT.003') {
            materialiBlender[nomeMat] = child.material;
          }

          // Identifichiamo l'elemento geometrico del Top (quello che inizialmente ha il materiale 001)
          if (nomeMat === 'Top_MAT.001') {
            meshTop = child;
          }
        }
      });

      console.log("✅ Materiali mappati dal file originale:", materialiBlender);
    }, undefined, (error) => {
      console.error('Errore nel caricamento del file .glb:', error);
    });

    // Funzione centralizzata per cambiare materiale alla mesh recuperandolo dall'archivio nativo
    function cambiaMaterialeTop(nomeMateriale) {
      if (!meshTop) {
        console.warn("Mesh del top non ancora caricata o trovata.");
        return;
      }
      
      const materialeScelto = materialiBlender[nomeMateriale];
      
      if (materialeScelto) {
        meshTop.material = materialeScelto;
        meshTop.material.needsUpdate = true;
        console.log(`Applicato materiale nativo: ${nomeMateriale}`);
      } else {
        console.error(`Errore: Il materiale ${nomeMateriale} non è stato trovato dentro il file .glb`);
      }
    }

    // 7. Eventi Pulsanti Menu
    document.getElementById('btn-mat1').addEventListener('click', () => {
      cambiaMaterialeTop('Top_MAT.001');
    });

    document.getElementById('btn-mat2').addEventListener('click', () => {
      cambiaMaterialeTop('Top_MAT.002');
    });

    document.getElementById('btn-mat3').addEventListener('click', () => {
      cambiaMaterialeTop('Top_MAT.003');
    });

    // 8. Loop di Rendering
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 9. Gestione Finestra Browser
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
