<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzazione modello 3D | AT‑render</title>
  
  <script type="importmap">
    {
      "imports": {
        "three": "../js/three.module.js"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    #menu {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #ffffff;
      color: #1a1a1a;
      border-color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="menu">
    <button id="btn-marmo">Top Marmo Marquinia</button>
    <button id="btn-noce">Top Noce Canaletto</button>
    <button id="btn-vetro">Top Vetro Fumé</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from '../js/GLTFLoader.js';
    import { OrbitControls } from '../js/OrbitControls.js';

    // 1. Configurazione Scena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    // 2. Configurazione Camera
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2, 2.5, 4); 

    // 3. Configurazione Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4; 
    document.body.appendChild(renderer.domElement);

    // 4. Illuminazione da Studio potente
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.0);
    scene.add(hemiLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight1.position.set(4, 8, 4);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xabcdef, 1.5);
    dirLight2.position.set(-4, 5, -4);
    scene.add(dirLight2);

    // 5. Controlli OrbitControls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.3, 0); 

    let tavoloModello = null;
    let materialeTop = null; 

    // 6. Caricamento Modello .glb locale
    const loader = new GLTFLoader();
    loader.load('./Lemans.tavolo.glb', (gltf) => {
      tavoloModello = gltf.scene;
      tavoloModello.scale.set(1, 1, 1); 
      scene.add(tavoloModello);
      
      tavoloModello.traverse((child) => {
        if (child.isMesh) {
          if (child.material && child.material.name === 'Top_MAT') {
            materialeTop = child.material;
          }
        }
      });

      if (materialeTop) {
        console.log(`✅ Agganciato materiale del top mappato: "${materialeTop.name}"`);
        impostaVetro(materialeTop); // Default iniziale richiesto: Vetro Fumé
      }

    }, undefined, (error) => {
      console.error('Errore nel caricamento del file .glb:', error);
    });

    // 🛠️ RESET COMPLETO DEL MATERIALE (Standard)
    function resetMateriale(mat) {
      mat.map = null;             
      mat.normalMap = null;       
      mat.roughnessMap = null;    
      mat.metalnessMap = null;    
      mat.bumpMap = null;
      mat.transparent = false;
      mat.opacity = 1.0;
      mat.roughness = 0.1;
      mat.metalness = 0.0;
      if (mat.transmission !== undefined) mat.transmission = 0.0;
    }

    // 🪵 GENERATORE VENATURE LEGNO STANDARD (Sfrutta l'UV mapping di Blender)
    function generaTextureLegno() {
      const size = 1024; 
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Colore base Noce scuro e ricco
      ctx.fillStyle = '#52331c';
      ctx.fillRect(0, 0, size, size);

      // Disegno linee venature marcate ed evidenti
      for (let i = -size; i < size * 2; i += 6) {
        ctx.beginPath();
        const opacita = 0.3 + Math.random() * 0.4;
        ctx.strokeStyle = Math.random() > 0.4 ? `rgba(25, 12, 3, ${opacita})` : `rgba(115, 78, 48, ${opacita})`;
        ctx.lineWidth = 1.5 + Math.random() * 3;
        
        for (let y = 0; y <= size; y += 4) {
          const wave1 = Math.sin(y * 0.02) * 30;
          const wave2 = Math.cos(y * 0.004) * 45;
          const x = i + wave1 + wave2 + (y * 0.1); 
          
          if (y === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      // Grazie al tuo UV mapping, ora possiamo usare il ripetitore nativo di Three.js
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1, 2); // Regola questi numeri se vuoi stringere o allargare le vene
      return texture;
    }

    // 7. Funzioni di Finitura (NATIVE)
    function impostaMarmo(mat) {
      resetMateriale(mat);        
      mat.color = new THREE.Color(0x111111); // Nero specchiato
      mat.roughness = 0.02;                  
      mat.metalness = 0.0;
      mat.needsUpdate = true;
    }

    function impostaNoce(mat) {
      resetMateriale(mat);        
      const tex = generaTextureLegno();
      
      mat.map = tex;                         // Applica la texture direttamente sulle coordinate UV
      mat.bumpMap = tex;                     // Crea il micro-rilievo
      mat.bumpScale = 0.015;                 // Altezza del rilievo sulle vene
      
      mat.color = new THREE.Color(0xffffff); // Lasciamo bianco per far vedere i colori del canvas
      mat.roughness = 0.45;                  // Finitura satinata legno
      mat.metalness = 0.0;
      mat.needsUpdate = true;
    }

    function impostaVetro(mat) {
      resetMateriale(mat);        
      mat.color = new THREE.Color(0x1a2226); 
      mat.roughness = 0.01;                  
      mat.metalness = 0.1;
      mat.transparent = true;
      mat.opacity = 0.25;                    
      
      if (mat.transmission !== undefined) {
        mat.transmission = 0.95;             
        mat.ior = 1.5;                       
      }
      mat.needsUpdate = true;
    }

    // 8. Eventi Pulsanti
    document.getElementById('btn-marmo').addEventListener('click', () => {
      if (materialeTop) impostaMarmo(materialeTop);
    });

    document.getElementById('btn-noce').addEventListener('click', () => {
      if (materialeTop) impostaNoce(materialeTop);
    });

    document.getElementById('btn-vetro').addEventListener('click', () => {
      if (materialeTop) impostaVetro(materialeTop);
    });

    // 9. Loop di Rendering
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 10. Risoluzione Schermo
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
