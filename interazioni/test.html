<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzazione modello 3D | AT‑render</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js';

    // 1. Creazione della Scena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    // 2. Creazione della Camera
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    // Posizioniamo la camera leggermente distante e in alto per vedere bene il tavolo
    camera.position.set(3, 3, 5);

    // 3. Creazione del Renderer (Motore Grafico)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 4. Illuminazione della scena
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // 5. Controlli del Mouse (OrbitControls)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // Rende il movimento più fluido ed elastico
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0); // Punta il centro della scena

    // 6. Caricamento del Modello 3D (.glb)
    // NOTA: 'Lemans.tavolo.glb' ha la 't' minuscola come sul tuo repository GitHub
    const loader = new GLTFLoader();
    loader.load('./Lemans.tavolo.glb', (gltf) => {
      scene.add(gltf.scene);
      console.log('Modello caricato con successo!');
    }, undefined, (error) => {
      console.error('Errore nel caricamento del modello:', error);
    });

    // 7. Ciclo di Animazione Continuo (Mancava nel vecchio file)
    function animate() {
      requestAnimationFrame(animate);

      // Aggiorna l'inerzia dei controlli del mouse
      controls.update();

      // Disegna la scena dal punto di vista della camera
      renderer.render(scene, camera);
    }

    // Avvia l'animazione per la prima volta
    animate();

    // 8. Gestione del ridimensionamento della finestra del browser
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
