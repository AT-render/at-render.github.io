<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzazione modello 3D | AT‑render</title>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    #menu {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 8px;
    }
    button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div id="menu">
    <button id="btn-marmo">Top Marmo Marquinia</button>
    <button id="btn-noce">Top Noce Canaletto</button>
    <button id="btn-vetro">Top Vetro Fumé</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Scena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2, 2, 3); 

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // Luci
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(hemiLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight1.position.set(5, 10, 7.5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight2.position.set(-5, 5, -5);
    scene.add(dirLight2);

    // Controlli
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.5, 0); 

    let tavoloModello = null;
    let materialeTop = null; // Salverà il riferimento a top_MAT

    // Loader GLTF
    const loader = new GLTFLoader();
    loader.load('./Lemans.tavolo.glb', (gltf) => {
      tavoloModello = gltf.scene;
      tavoloModello.scale.set(1, 1, 1); 
      scene.add(tavoloModello);
      
      // Cerchiamo i materiali scorrendo le mesh del modello
      tavoloModello.traverse((child) => {
        if (child.isMesh) {
          // Se l'oggetto ha più materiali (array), cerchiamo dentro l'array
          if (Array.isArray(child.material)) {
            child.material.forEach((mat) => {
              if (mat.name === 'top_MAT') materialeTop = mat;
            });
          } else {
            // Se l'oggetto ha un singolo materiale associato
            if (child.material && child.material.name === 'top_MAT') {
              materialeTop = child.material;
            }
          }
        }
      });

      if (materialeTop) {
        console.log("Materiale 'top_MAT' agganciato con successo!");
        // Impostiamo il Marmo come look iniziale
        impostaMarmo(materialeTop);
      } else {
        console.warn("Attenzione: non ho trovato nessun materiale chiamato 'top_MAT'.");
      }

    }, undefined, (error) => {
      console.error('Errore nel caricamento del modello:', error);
    });

    // Funzioni di modifica dirette (puliscono le vecchie proprietà per evitare sovrapposizioni visive)
    function impostaMarmo(mat) {
      mat.color = new THREE.Color(0x141414); // Corretto uso di THREE.Color
      mat.roughness = 0.05;
      mat.metalness = 0.1;
      mat.transparent = false;
      mat.opacity = 1.0;
      if (mat.transmission !== undefined) mat.transmission = 0.0;
      mat.needsUpdate = true;
    }

    function impostaNoce(mat) {
      mat.color = new THREE.Color(0x4a3319);
      mat.roughness = 0.6;
      mat.metalness = 0.0;
      mat.transparent = false;
      mat.opacity = 1.0;
      if (mat.transmission !== undefined) mat.transmission = 0.0;
      mat.needsUpdate = true;
    }

    function impostaVetro(mat) {
      mat.color = new THREE.Color(0x2c3539);
      mat.roughness = 0.1;
      mat.metalness = 0.1;
      mat.transparent = true;
      mat.opacity = 0.4; // Trasparenza
      if (mat.transmission !== undefined) {
        mat.transmission = 0.9; // Se il materiale supporta il vetro fisico di Blender
      }
      mat.needsUpdate = true;
    }

    // Eventi pulsanti
    document.getElementById('btn-marmo').addEventListener('click', () => {
      if (materialeTop) impostaMarmo(materialeTop);
    });

    document.getElementById('btn-noce').addEventListener('click', () => {
      if (materialeTop) impostaNoce(materialeTop);
    });

    document.getElementById('btn-vetro').addEventListener('click', () => {
      if (materialeTop) impostaVetro(materialeTop);
    });

    // Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
